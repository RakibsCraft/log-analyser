[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyser"
version = "1.0.0"
description = "Detects brute-force attacks, password spraying and compromised accounts in Linux auth logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
log-analyser = "log_analyser.cli:main"

[tool.setuptools]
packages = ["log_analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
